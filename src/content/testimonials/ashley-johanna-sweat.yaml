quote: >-
  Neighborly is an incredibly emotional and raw story, and it was so important
  to me that those moments were portrayed with the honesty, sensitivity and
  depth they deserved. She brought genuine emotion to every single part of the
  story. Nothing felt forced or exaggerated. She didn't just narrate my story.
  She felt it, and that made all the difference.
author: Ashley Johanna Sweat
bookTitle: Neighborly
