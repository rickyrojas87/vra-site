quote: >-
  Vikki brought my story and characters to life in a way that exceeded my
  expectations. Her impressive range gave each character a distinct voice and
  personality that felt true to who they were. As an author, you spend so much
  time with these characters in your head, and hearing someone else understand
  them is such a special experience. I would absolutely work with her again!
author: Daya Winters
bookTitle: Smother
