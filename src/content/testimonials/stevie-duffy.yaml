quote: >-
  Vikki is a brilliant narrator with a real talent for character work. Two
  books we've done together, and I feel like she somehow managed to teach me a
  thing or two about my own books! She's also super professional and always
  kept me informed. I can't think of a single day where she didn't check in
  with me. I can't wait to work with her again (and again).
author: Stevie Duffy
bookTitle: Old Bastards and Fragile Steps
