steps:
  - title: Send your book
    short: Share the manuscript, word count and deal type through the quote form. You get a quote and next steps within two business days.
    long: Share the manuscript, word count and deal type through the quote form. You get a quote and next steps within two business days.
  - title: Manuscript review
    short: I read the entire manuscript over one to two weeks, prepping plot lines, character arcs and pronunciations. Your pronunciation list and character notes help here.
    long: I spend one to two weeks, depending on the length of the book, reading the entire manuscript and prepping plot lines, character arcs and pronunciations. It helps to send a list of preferred pronunciations for foreign or invented words and names, along with any character notes on accents and personality.
  - title: First fifteen
    short: 'I record the first 15 minutes to set pacing, tone and voices. Once approved, creative direction is entrusted to me. Per-finished-hour projects: a 25% deposit is due.'
    long: I record the first 15 minutes of the book to set the pacing, tone and any characters introduced. Once approved, creative direction for the rest of the book is entrusted to me. On per-finished-hour projects, a 25% deposit of the estimated total is due at approval.
  - title: Punch and roll
    short: Over four to six weeks I record, edit and master the rest of the book in my studio, then upload every finished file for your review.
    long: Over the next four to six weeks I record, edit and master the remainder of the book in my studio, and upload all of the files for review once fully complete.
  - title: Your review
    short: 'You note any pickups: technical flubs, mispronunciations or missing words. Two rounds of pickups are included. Additional rounds are subject to extra fees.'
    long: You listen through all the audio and note any words or phrases for pickups. Pickups are reserved for technical flubs, mispronunciations and missing words. Two rounds of pickups are included free of charge; additional rounds of re-recording are subject to extra fees.
  - title: Payment and release
    short: Once every file is approved, final payment is made before the finished audio goes to the publishing platform for quality assurance and release.
    long: Once all files are approved, final payment is made before the finished audio is uploaded to the publishing platform for its final quality assurance review and release.
